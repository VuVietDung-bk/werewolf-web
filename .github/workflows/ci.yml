name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ma_soi
          POSTGRES_USER: ma_soi
          POSTGRES_PASSWORD: ma_soi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ma_soi -d ma_soi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ma_soi:ma_soi_test@127.0.0.1:5432/ma_soi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[dev]'
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest
        working-directory: backend
      - run: alembic check
        working-directory: backend
      - run: alembic downgrade base
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
