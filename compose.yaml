services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ma_soi
      POSTGRES_USER: ma_soi
      POSTGRES_PASSWORD: ma_soi_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ma_soi -d ma_soi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
