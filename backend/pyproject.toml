[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ma-soi-web-api"
version = "0.1.0"
description = "API for a moderator-led Werewolf web game"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.144.0",
  "uvicorn[standard]==0.54.0",
  "SQLAlchemy==2.0.55",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "Pillow==11.3.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
