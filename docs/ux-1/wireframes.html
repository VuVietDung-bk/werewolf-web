<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent;border-radius:5px;padding:7px 10px;text-align:left}button:hover{background:#404249}button.active,button.primary{background:var(--brand);color:white}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}input,select,textarea{background:#1e1f22;border:1px solid var(--line);border-radius:5px;padding:8px;max-width:100%}textarea{width:100%;resize:none}a{color:#b9c0ff}h1,h2,h3,p{margin:0}h1{font-size:18px}h2{font-size:19px;margin-bottom:14px}h3{font-size:15px;margin:16px 0 8px}small,.muted,time{color:var(--muted);font-size:12px}.prototype{height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#18191c;font-size:12px}.prototype select{font-size:12px;padding:2px 5px}.prototype a{margin-left:auto}.app{height:calc(100dvh - 36px);display:flex;flex-direction:column;min-height:0}.top{height:52px;flex:none;border-bottom:1px solid #1e1f22;display:flex;align-items:center;padding:0 12px;gap:16px}.top nav{display:flex;gap:4px}.top nav button{min-width:82px;text-align:center;font-weight:650}.room-menu{margin-right:auto;font-weight:700}.phase{font-size:12px;color:var(--muted)}.workspace{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(0,1fr) 220px}.side,.members{min-height:0;overflow-y:auto;background:var(--side);padding:12px 8px}.side button{width:100%;display:flex;gap:9px;align-items:center;margin:2px 0;color:var(--muted)}.side button.active{background:#404249;color:var(--text)}.side .section-label,.members h3{font-size:11px;letter-spacing:.06em;font-weight:750;text-transform:uppercase;padding:12px 8px 4px;color:var(--muted)}.side .section-label:first-child{padding-top:0}.hash{font-size:21px;color:#949ba4;line-height:1}.badge{font-size:10px;border-radius:4px;padding:1px 5px;background:#4d5485;color:#fff;white-space:nowrap}.side .badge{margin-left:auto}.person{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px}.avatar{width:32px;height:32px;border-radius:50%;background:#51566e;display:inline-grid;place-items:center;flex:none;color:#fff;font-size:12px;font-weight:700}.person small{display:block;font-size:11px}.person div{min-width:0;overflow-wrap:anywhere}.member-name{font-size:13px}.center{min-height:0;min-width:0;display:flex;flex-direction:column}.channel-header{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}.channel-header strong{font-size:15px}.channel-header .topic{color:var(--muted);font-size:12px;border-left:1px solid var(--line);padding-left:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.member-toggle{margin-left:auto;display:none}.channel-toggle{display:none}.scroll{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#1e1f22 var(--side);scrollbar-width:thin}.timeline{padding:14px 0 10px}.message{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:3px 16px}.message:hover{background:#2e3035}.message.group{margin-top:12px}.message .message-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.message strong{font-size:14px}.message p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.message .ghost{font-size:10px;color:var(--muted);text-align:center;visibility:hidden}.message:hover .ghost{visibility:visible}.reaction{background:#292b30;border:1px solid #51566e;padding:1px 7px;font-size:12px;margin-top:4px}.message-menu{position:absolute;right:12px;top:-15px;display:none;background:#1e1f22;box-shadow:0 2px 5px #1119}.message:hover .message-menu,.message:focus-within .message-menu{display:flex}.divider{display:flex;align-items:center;gap:10px;margin:18px 16px;color:var(--muted);font-size:11px}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.composer-wrap{flex:none;padding:8px 16px 12px}.composer{background:var(--input);border-radius:8px;display:flex;align-items:flex-end;gap:6px;padding:6px}.composer textarea{min-height:36px;height:36px;max-height:120px;border:0;background:transparent;padding:7px;outline-offset:-2px}.composer button{flex:none}.composer-note{font-size:11px;color:var(--muted);margin-top:4px;min-height:16px}.readonly{padding:12px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}.new-pill{align-self:center;background:var(--brand);border-radius:30px;font-size:12px;padding:5px 14px;margin-top:-30px;z-index:1}.panel-scroll{padding:20px;flex:1;min-height:0;overflow:auto}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:100px}.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row .grow{flex:1;min-width:0}.row strong{font-size:14px}.row p{font-size:13px;color:var(--muted)}.role-icon{width:40px;height:40px;object-fit:contain;image-rendering:pixelated;flex:none}.faction{font-size:11px;border-radius:20px;padding:2px 8px;display:inline-block}.village{background:#284d3e;color:#b5e5cb}.wolf{background:#553239;color:#ffc1c7}.neutral{background:#493d5e;color:#ddc8ff}.qty{width:62px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:8px;padding:16px}.card p{font-size:13px;color:var(--muted);margin:10px 0}.card .role-icon{width:56px;height:56px}.card button{margin-top:8px}.hint{border-left:3px solid #949cf7;background:#292b30;padding:12px;margin:12px 0;font-size:13px}.vote-controls{flex:none;padding:14px 16px;border-top:1px solid var(--line);background:var(--side)}.vote-controls .toolbar{margin:0}.vote-state{display:flex;gap:10px;padding:10px 16px;background:#2b2d31;font-size:13px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{padding:14px;background:var(--side);border-radius:6px}.stat b{display:block;font-size:22px}.mock-label{font-size:11px;color:#c8c1a6}.modal{width:min(570px,calc(100vw - 24px));max-height:calc(100dvh - 28px);border:1px solid #55585f;border-radius:10px;background:var(--bg);color:var(--text);padding:0;box-shadow:0 10px 60px #0008}.modal::backdrop{background:#0009}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0}.dialog-body{padding:16px;max-height:calc(100dvh - 180px);overflow:auto}.dialog-body label{display:grid;gap:5px;margin-bottom:14px;font-size:13px}.dialog-body label.inline{display:flex;align-items:center}.dialog-footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;background:var(--side)}.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;border-radius:0;width:min(430px,100vw)}.description-field{height:180px;min-height:180px}.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.emoji-grid button{font-size:24px;text-align:center}.status-line{font-size:12px;color:#c8caff;margin-top:10px;min-height:18px}.menu-stack{display:grid;gap:4px}.hide{display:none!important}.workspace.two{grid-template-columns:232px minmax(0,1fr)}.empty{padding:40px 24px;color:var(--muted)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:500}.mobile-brand{display:none}
@media(max-width:1199px){.workspace{grid-template-columns:220px minmax(0,1fr)}.members{display:none}.member-toggle{display:block}.workspace.two{grid-template-columns:220px minmax(0,1fr)}}
@media(max-width:759px){.prototype{gap:6px;padding:0 6px}.prototype .prototype-title{display:none}.prototype a{font-size:10px}.top{height:52px;padding:0 8px;gap:6px}.top nav{flex:1}.top nav button{min-width:0;flex:1;padding:8px 10px}.room-menu{max-width:44px;overflow:hidden;white-space:nowrap;padding:8px}.phase{display:none}.workspace,.workspace.two{grid-template-columns:minmax(0,1fr)}.side{display:none}.channel-toggle{display:block}.channel-header{padding:0 8px;gap:8px}.channel-header .topic{display:none}.composer-wrap{padding:8px}.message{padding-left:10px;padding-right:10px;gap:8px}.panel-scroll{padding:14px}.cards{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr}.row{flex-wrap:wrap;gap:8px}.row .grow{min-width:140px}.vote-controls{padding:10px}.vote-controls select{width:100%}.drawer{width:min(360px,100vw)}.mobile-brand{display:inline}.dialog-body{max-height:calc(100dvh - 200px)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.modal[open]{display:flex;flex-direction:column;overflow:hidden}.dialog-head,.dialog-footer{flex:none}.dialog-body{min-height:0;overflow-y:auto}.dialog-footer{border-top:1px solid var(--line)}.dialog-body label{display:grid;gap:6px;margin-bottom:14px}.dialog-body label.inline{display:flex;align-items:center}.dialog-footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 16px}button{border:0;background:transparent;color:var(--text);border-radius:5px;cursor:pointer;font:inherit;padding:7px 10px}button:hover{background:#41434a}button.primary{background:var(--brand);color:white}button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.members button{text-align:left}.side button{text-align:left}

.top nav{flex:1}.top nav button{flex:1}.room-menu{width:208px;text-align:left;margin-right:0}.drawer .dialog-body{flex:1}.skeleton{height:42px;margin:16px;border-radius:4px;background:linear-gradient(90deg,#41434a 0 15%,#383a40 15% 85%,transparent 85%)}.mock-banner{padding:8px 16px;background:#464037;color:#f4dfbb;font-size:12px}

<body>
<div class="prototype" aria-label="Điều khiển bản nháp"><span class="prototype-title">BẢN NHÁP UX1 · dữ liệu giả</span><label>Vai <select id="actor"><option value="host">Quản trò</option><option value="wolf">Người Sói</option><option value="player">Người Làng</option></select></label><label>Ván <select id="stage"><option value="playing">Đang chơi</option><option value="lobby">Sảnh</option><option value="draft">Chọn role</option><option value="assigned">Đã phát role</option><option value="finished">Kết thúc</option></select></label><a href="product-spec.md">Đặc tả</a></div>
<div class="app">
<header class="top"><button class="room-menu" id="room-menu" aria-label="Menu phòng Làng Sương Mù"><span class="mobile-brand">☾</span><span class="room-label">Làng Sương Mù ▾</span></button><nav aria-label="Điều hướng phòng"><button data-tab="chat">Chat</button><button data-tab="role">Role</button><button data-tab="management">Quản lý</button></nav><span class="phase" id="phase">● Ngày 1 · Đã kết nối</span></header>
<main class="workspace" id="workspace"><aside class="side" id="sidebar" aria-label="Danh sách kênh hoặc tác vụ"></aside><section class="center" id="center" aria-label="Nội dung được chọn"></section><aside class="members" id="members" aria-label="Danh sách người chơi"></aside></main>
</div>
<dialog class="modal" id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Đóng">✕</button></div><div class="dialog-body" id="dialog-body"></div><div class="dialog-footer" id="dialog-footer"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people=[{id:'an',name:'An',initial:'A',alive:true},{id:'binh',name:'Bình',initial:'B',alive:true},{id:'chi',name:'Chi',initial:'C',alive:true},{id:'duong',name:'Dương',initial:'D',alive:true},{id:'linh',name:'Linh',initial:'L',alive:false}];
const roles=[{name:'Tiên Tri',faction:'Làng',cls:'village',icon:'seer',qty:1,seer:'Làng',kind:'Chủ động',desc:'Mỗi đêm nhắn quản trò tên người muốn soi. Quản trò trả lời kết quả soi theo mô tả của role được chọn.'},{name:'Sói thường',faction:'Sói',cls:'wolf',icon:'wolf',qty:2,seer:'Sói',kind:'Chủ động',desc:'Thảo luận trong kênh đội vào ban đêm. Gửi lựa chọn cho quản trò; mọi kết quả do quản trò xác nhận.'},{name:'Thợ Săn',faction:'Làng',cls:'village',icon:'hunter',qty:1,seer:'Làng',kind:'Bị động',desc:'Khi có điều kiện kích hoạt, quản trò liên hệ để xác nhận lựa chọn. Không chủ động gửi yêu cầu.'},{name:'Kẻ Độc Hành',faction:'Trung lập',cls:'neutral',icon:'neutral',qty:1,seer:'Làng',kind:'Bị động',desc:'Điều kiện chiến thắng do quản trò quy định. Không tự động xử lý trên hệ thống.'}];
let actor='host',stage='playing',tab='chat',sub='general',voteMode='public',ballot=null,voteClosed=false,selectedRole=null;
let scrollPositions={},drafts={},messages={},requestAccepted=false,unread=false,demoState='normal';
const sample={general:[['host','Quản trò','Ngày 1 bắt đầu. Mọi người có thể thảo luận.','09:30'],['an','An','Mình nghĩ nên nghe từng người kể lại trước.','09:31'],['an','An','Bình có thông tin gì không?','09:31'],['binh','Bình','Tối qua mình chưa có thông tin mới 🙂','09:32'],['chi','Chi','Mọi người bình tĩnh nhé.','09:32'],['duong','Dương','Mình sẽ đọc lại đoạn chat hôm qua.','09:33']],announcements:[['host','Quản trò','Ngày 1 bắt đầu. Đêm qua có một người không trở về: Linh.','09:30'],['host','Quản trò','Vòng vote sẽ mở sau khi mọi người thảo luận.','09:30']],team:[['an','An','Đêm nay mình chờ ý kiến mọi người.','22:10'],['binh','Bình','Đồng ý, chưa gửi quyết định nhé. 🐺','22:11']],dm:[['host','Quản trò','Mình đã nhận thông tin của bạn.','22:12'],['an','An','Cảm ơn quản trò!','22:13']]};
function who(){return actor==='host'?'host':'an'}
function icon(r){return `<img class="role-icon" src="../../frontend/public/assets/v1/role-${r.icon}-v1-128.png" alt="">`}
function hostBadge(id){return id==='host'?'<span class="badge">QUẢN TRÒ</span>':''}
function openDialog(title,body,footer='',drawer=false){const d=$('dialog');d.classList.toggle('drawer',drawer);$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-footer').innerHTML=footer||'<button data-close>Đóng</button>';d.showModal();d.querySelector('[data-close]')?.addEventListener('click',()=>d.close());d.setAttribute('aria-labelledby','dialog-title')}
$('close-dialog').onclick=()=>$('dialog').close();
function saveDraft(){if($('compose-text'))drafts[`${actor}/${stage}/${sub}`]=$('compose-text').value;if($('timeline'))scrollPositions[`${actor}/${sub}`]=$('timeline').scrollTop}
function channelList(){let x=[['announcements','◉','Thông báo'],['vote','☑','Vote'],['general','#','general']];if(stage!=='lobby'&&stage!=='draft'&&(actor!=='player'||stage==='finished'))x.push(['team','#','đội-sói']);if(stage!=='lobby'&&stage!=='draft') {if(actor==='host'||stage==='finished')people.forEach(p=>x.push([`dm-${p.id}`,'◌',p.name]));else x.push(['dm','◌','Quản trò'])}return x}
function sideMarkup(){if(tab==='chat'){return channelList().map(([id,glyph,label],i)=>`${i===0?'<div class="section-label">Đặc biệt</div>':i===2?'<div class="section-label">Chung</div>':i===3?'<div class="section-label">Riêng</div>':''}<button class="${sub===id?'active':''}" data-route="chat/${id}"><span class="hash">${glyph}</span>${esc(label)}${id==='vote'&&stage==='playing'?'<span class="badge">ĐANG MỞ</span>':''}</button>`).join('')}
const items=tab==='role'?(actor==='host'?[['catalog','Bộ role'],...(stage==='lobby'||stage==='draft'||stage==='assigned'?[['distribution','Phát role']]:[])]:[['mine','Role của tôi'],['catalog','Danh mục']]):actor==='host'?(stage==='finished'?[['history','Nhật ký'],['room','Phòng & ván mới']]:stage==='lobby'||stage==='draft'?[['room','Phòng & thành viên'],['players','Người chơi']]:[['players','Người chơi'],['requests','Yêu cầu role'],['game','Điều hành'],['settings','Cài đặt'],['scheduled','Tin hẹn đăng']]):[['room','Thông tin phòng'],...(stage==='finished'?[['history','Nhật ký']]:[])];return `<div class="section-label">${tab==='role'?'Role':'Quản lý'}</div>`+items.map(([id,label])=>`<button class="${sub===id?'active':''}" data-route="${tab}/${id}">${label}${id==='requests'&&!requestAccepted?'<span class="badge">1</span>':''}</button>`).join('')}
function memberMarkup(){return `<h3>Quản trò — 1</h3><button class="person" data-person="host"><span class="avatar">☾</span><div><span class="member-name">Minh</span><small>Quản trò</small></div></button><h3>Đang sống — 4</h3>`+people.filter(p=>p.alive).map(personMarkup).join('')+'<h3>Đã công bố chết — 1</h3>'+people.filter(p=>!p.alive).map(personMarkup).join('')}
function personMarkup(p){return `<button class="person" data-person="${p.id}"><span class="avatar">${p.initial}</span><div><span class="member-name">${esc(p.name)}</span><small>Ghế ${people.indexOf(p)+1}${actor==='host'?' · '+roles[people.indexOf(p)%4].name:''}</small></div></button>`}
function header(title,topic=''){return `<div class="channel-header"><button class="channel-toggle" id="channels-toggle" aria-label="Mở danh sách kênh hoặc tác vụ">☰</button><strong>${esc(title)}</strong><span class="topic">${esc(topic)}</span><button class="member-toggle" id="members-toggle" aria-label="Mở danh sách người chơi">♙</button></div>`}
function rowMarkup(m,i,all){const grouped=i>0&&all[i-1][0]===m[0];return `<article class="message ${grouped?'':'group'}" tabindex="0">${grouped?`<span class="ghost">${m[3]}</span>`:`<span class="avatar">${m[0]==='host'?'☾':esc(m[1][0])}</span>`}<div>${grouped?'':`<div class="message-head"><strong>${esc(m[1])}</strong>${hostBadge(m[0])}<time>${m[3]}</time></div>`}<p>${esc(m[2])}</p>${i===2?'<button class="reaction" aria-label="Đồng ý với tin này">👍 2</button>':''}</div><div class="message-menu"><button data-react aria-label="Thêm emoji reaction">☺</button>${actor==='host'&&m[0]==='host'&&stage!=='finished'?'<button data-edit-message>Sửa</button><button data-delete-message>Xóa</button>':''}</div></article>`}
function chatMarkup(){if(sub==='vote')return voteMarkup();const kind=sub.startsWith('dm')?'dm':sub;const info=channelList().find(x=>x[0]===sub);const title=info?.[2]||'general';const readonly=stage==='finished'||sub==='announcements'&&actor!=='host'||kind==='team';const data=messages[`${actor}/${sub}`]||sample[kind]||sample.general;return header((kind==='dm'?'◌ ':'# ')+title,kind==='dm'?'Riêng trong trận · Công bố toàn bộ sau trận':sub==='announcements'?'Chỉ quản trò đăng tin':kind==='team'?'Ban ngày · Chỉ đọc':'Chat chung của làng')+`<div class="scroll timeline" id="timeline"><div class="divider">19 tháng 11 · ${stage==='lobby'?'Sảnh chờ':'Ngày 1'}</div>${data.map(rowMarkup).join('')}${kind==='dm'?'<article class="message group"><span class="avatar">A</span><div><strong>Yêu cầu dùng role</strong><p>Tôi muốn xác nhận dùng kỹ năng trong đêm này.</p><small>'+ (requestAccepted?'Đã chấp nhận · Quản trò đã phản hồi':'Đang xét · Chỉ bạn và quản trò')+'</small></div></article>':''}</div><button id="new-messages" class="new-pill hide">Có tin mới · Đến cuối</button>`+(readonly?`<div class="readonly">${stage==='finished'?'Ván đã kết thúc · Toàn bộ lịch sử chỉ đọc.':kind==='team'?'Chat đội chỉ gửi ban đêm; bạn vẫn đọc được tin cũ.':'Chỉ quản trò có thể đăng thông báo.'}</div>`:`<div class="composer-wrap">${sub==='announcements'?'<div class="toolbar"><select id="timing" aria-label="Thời điểm đăng"><option value="now">Gửi ngay</option>'+ (stage==='playing'?'<option value="next">Pha tiếp theo</option>':'')+'</select></div>':''}<form id="composer" class="composer"><button type="button" id="emoji" aria-label="Chọn emoji">☺</button><textarea id="compose-text" rows="1" maxlength="2000" placeholder="Nhắn ${esc(title)}" aria-label="Nội dung tin nhắn">${esc(drafts[`${actor}/${stage}/${sub}`]||'')}</textarea><button type="submit" class="primary" aria-label="Gửi tin">➤</button></form><div class="composer-note">Enter gửi · Shift + Enter xuống dòng${kind==='dm'&&actor!=='host'?' · <button id="request-button" style="padding:0 4px;font-size:11px">Gửi yêu cầu role</button>':''}</div></div>`)}
function voteMarkup(){if(stage==='lobby'||stage==='draft'||stage==='assigned')return header('☑ Vote','Chưa có vòng')+'<div class="empty">Vote chỉ mở khi trận bắt đầu và đang là ban ngày.</div>';return header('☑ Vote','Quản trò quyết định kết quả')+`<div class="vote-state"><strong>Ngày 1 · ${voteClosed?'Đã đóng':'Còn 02:38'}</strong><span class="badge">${voteMode==='public'?'CÔNG KHAI':'BÍ MẬT'}</span><span class="spacer"></span>${actor==='host'&&stage!=='finished'?'<button id="open-vote" class="primary">Mở vòng mới</button><button id="close-vote">Đóng vòng</button>':''}</div><div class="scroll timeline" id="timeline"><div class="divider">Vòng vote ngày 1</div>${voteMode==='public'||stage==='finished'?'<article class="message group"><span class="avatar">B</span><div><strong>Bình</strong><time> 09:41</time><p>Bình vote An</p></div></article><article class="message group"><span class="avatar">C</span><div><strong>Chi</strong><time> 09:42</time><p>Chi bỏ qua</p></div></article>':'<div class="empty">Vòng bí mật · Bạn chỉ thấy phiếu của mình.</div>'}${ballot?`<article class="message group"><span class="avatar">A</span><div><strong>An</strong><time> Vừa xong</time><p>${esc(ballot)}</p></div></article>`:''}${actor==='host'?'<div class="hint">Chỉ quản trò: 2 phiếu đã gửi · 2 chưa gửi. Không cần đợi đủ phiếu.</div>':''}</div><div class="vote-controls">${stage==='finished'?'Ván kết thúc · Chỉ đọc':actor==='host'?'<button id="decide-vote" class="primary">Chốt kết quả thủ công…</button><small> Kết quả không tự giết người chơi.</small>':`<form id="ballot-form"><div class="toolbar"><select id="ballot-choice" aria-label="Chọn phiếu nháp">${people.filter(p=>p.alive).map(p=>`<option value="${p.name}">${p.name}</option>`).join('')}<option value="skip">Bỏ qua</option></select><button class="primary" ${voteClosed?'disabled':''}>Chốt phiếu</button><button type="button" id="withdraw" ${!ballot||voteClosed?'disabled':''}>Rút phiếu</button></div><small>Chỉ gửi khi bấm Chốt phiếu. Được đổi/r function catalogMarkup(){return `<div class="toolbar"><input id="role-search" placeholder="Tìm role…" aria-label="Tìm role"><select id="faction-filter" aria-label="Lọc phe"><option value="">Mọi phe</option><option>Làng</option><option>Sói</option><option>Trung lập</option></select>${actor==='host'&&stage==='lobby'?'<button class="primary" id="create-role">+ Tạo role</button>':''}</div><div id="role-list">${roles.map((r,i)=>`<div class="row" data-role-row data-name="${r.name.toLowerCase()}" data-faction="${r.faction}">${icon(r)}<div class="grow"><button data-role="${i}" style="padding:0"><strong>${r.name}</strong></button> <span class="faction ${r.cls}">${r.faction}</span><p>Tiên tri soi ra: ${r.seer} · ${r.kind}</p></div>${actor==='host'&&stage==='lobby'?`<label><small>Số bản</small><input class="qty" type="number" min="0" value="${r.qty}" aria-label="Số bản ${r.name}"></label><button data-edit-role="${i}">Sửa</button>`:`<button data-role="${i}">Chi tiết</button>`}</div>`).join('')}</div>`}
function roleMarkup(){let html;if(sub==='distribution')html=`<h2>Phát role</h2><p class="muted">5 ghế · 5 suất đã cấu hình</p><div class="toolbar" style="margin-top:16px"><label><input type="radio" name="distribution" checked> Ngẫu nhiên</label><label><input type="radio" name="distribution"> Chọn tối đa 3</label></div><div class="hint">Xáo thứ tự chọn. Role đã nhận rời pool; còn 1–2 loại sẽ mời đúng số còn lại.</div><button id="distribute" class="primary">${stage==='draft'?'Random hộ lượt hiện tại':'Bắt đầu phát role'}</button><h3>Tiến độ</h3><div class="row"><span class="avatar">A</span><span>An · Đang chọn</span><small>2 / 5 lượt hoàn tất</small></div>`;else if(sub==='mine'&&stage==='draft')html=`<h2>Đến lượt bạn chọn role</h2><p class="muted">Chọn một lời mời hoặc Random từ pool còn hợp lệ.</p><div class="cards" style="margin-top:16px">${roles.slice(0,3).map((r,i)=>`<div class="card">${icon(r)}<h3>${r.name}</h3><p>${r.desc}</p><button class="primary" data-choose="${i}">Chọn role này</button></div>`).join('')}</div><button id="random-choice">🎲 Random</button>`;else if(sub==='mine')html=stage==='lobby'?'<h2>Role của tôi</h2><p>Chưa phát role. Bạn có thể xem toàn bộ Danh mục.</p>':`<h2>Role của tôi</h2><div class="card">${icon(roles[actor==='wolf'?1:0])}<h3>${selectedRole||roles[actor==='wolf'?1:0].name}</h3><p>${roles[actor==='wolf'?1:0].desc}</p><span class="faction ${actor==='wolf'?'wolf':'village'}">${actor==='wolf'?'Sói':'Làng'}</span></div><button id="my-request" ${stage==='finished'?'disabled':''}>Gửi yêu cầu role…</button><p class="muted">Quản trò xác nhận mọi kết quả.</p>`;else html=`<h2>${actor==='host'?'Bộ role':'Danh mục role'}</h2>`+catalogMarkup();return header('Role',stage==='playing'?'Snapshot trong ván · Chỉ đọc':'Thiết lập và chọn role')+`<div class="panel-scroll">${html}<p class="status-line" id="status" role="status"></p></div>`}
function manageMarkup(){let html;if(actor!=='host'&&!['room','history'].includes(sub)){sub='room'}if(sub==='room')html=`<h2>Làng Sương Mù</h2><p class="muted">Mã phòng: SUONG · 5 / 6 ghế</p><div class="hint">Chat và ghi chú kín được công bố sau trận cho thành viên đã đồng ý.</div>${stage==='finished'?'<button id="next-game" class="primary">Mở ván mới trong sảnh</button><button id="leave">Rời phòng</button>':actor==='host'?'<div class="toolbar"><button id="room-settings">Cài đặt phòng…</button><button id="begin-game" class="primary">Kiểm tra và bắt đầu</button></div>':'<button id="leave">Rời phòng</button>'}<h3>Thành viên</h3>${people.map(personMarkup).join('')}`;else if(sub==='players')html=`<h2>Người chơi</h2><div class="toolbar"><input id="player-search" placeholder="Tìm người chơi…" aria-label="Tìm người chơi"><button id="chat-settings">Cài đặt chat…</button></div>${people.map((p,i)=>`<div class="row" data-player-row data-name="${p.name.toLowerCase()}"><span class="avatar">${p.initial}</span><div class="grow"><strong>${p.name}</strong><p>${roles[i%4].name} · ${p.alive?'Đang sống':'Đã chết'}${i===0?' · 1 yêu cầu chờ':''}</p></div><button data-person="${p.id}">Thao tác…</button></div>`).join('')}`;else if(sub==='requests')html=`<h2>Yêu cầu role</h2><div class="toolbar"><select aria-label="Lọc yêu cầu"><option>Chưa xử lý</option><option>Đã xử lý</option></select></div><div class="row"><span class="avatar">A</span><div class="grow"><strong>An · ${requestAccepted?'Đã chấp nhận':'Đang chờ'}</strong><p>Tôi muốn xác nhận dùng kỹ năng trong đêm này.</p></div><button id="review-request" class="primary">Xử lý…</button></div>`;else if(sub==='game')html=`<h2>Điều hành</h2><div class="stat-grid"><div class="stat"><small>Pha</small><b>Ngày 1</b></div><div class="stat"><small>Trạng thái</small><b>Đang chơi</b></div><div class="stat"><small>Vote</small><b>${voteClosed?'Đã đóng':'Đang mở'}</b></div></div><div class="toolbar" style="margin-top:20px"><button id="advance" class="primary">Chuyển sang Đêm 2…</button><button id="pause-game">Tạm dừng…</button><button id="finish-game">Kết thúc ván…</button></div>`;else if(sub==='settings')html='<h2>Cài đặt</h2><div class="row"><div class="grow"><strong>Quyền chat và slow mode</strong><p>Chung, đội, người chết, giới hạn gửi.</p></div><button id="chat-settings">Chỉnh…</button></div><div class="row"><div class="grow"><strong>Thông tin phòng</strong><p>Tên, ghế và đăng ký.</p></div><button id="room-settings">Chỉnh…</button></div>';else if(sub==='scheduled')html='<h2>Tin hẹn đăng</h2><p class="muted">Chỉ quản trò thấy · Đăng vào lần chuyển pha thành công tiếp theo.</p><div class="row"><div class="grow"><strong>Đêm mới đã bắt đầu.</strong><p>Pha tiếp theo · Bản nháp #1</p></div><button id="edit-schedule">Sửa…</button><button id="cancel-schedule">Hủy lịch</button></div>';else html='<h2>Nhật ký sau trận</h2><p>Mọi tin riêng, phiếu và thao tác trong trò chơi được công bố cho thành viên theo consent.</p><div class="toolbar" style="margin-top:16px"><button id="export">Xuất JSON / CSV</button></div><div class="hint">Đây là dữ liệu mẫu. Không tạo file export của ván thật.</div><div class="row">Ngày 1 · An gửi yêu cầu → Quản trò xử lý → Vote công khai → Kết thúc</div>';return header('Quản lý',actor==='host'?'Công cụ theo tác vụ':'Thông tin phòng')+`<div class="panel-scroll">${html}<p id="status" class="status-line" role="status"></p></div>`}
function render(){if(tab==='management'&&actor!=='host'&&!['room','history'].includes(sub))sub='room';if(tab==='chat'&&!channelList().some(x=>x[0]===sub))sub='general';if(tab==='role'&&actor==='host'&&sub==='mine')sub='catalog';$('workspace').classList.toggle('two',tab!=='chat');$('members').classList.toggle('hide',tab!=='chat');$('sidebar').innerHTML=sideMarkup();$('members').innerHTML=memberMarkup();$('center').innerHTML=tab==='chat'?chatMarkup():tab==='role'?roleMarkup():manageMarkup();if(tab==='chat'&&sub!=='vote'&&demoState==='loading')$('timeline').innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';if(tab==='chat'&&sub!=='vote'&&demoState==='empty')$('timeline').innerHTML='<div class="empty">Chưa có tin nhắn trong kênh này.</div>';if(tab==='chat'&&demoState==='offline')$('center').insertAdjacentHTML('afterbegin','<div class="mock-banner">Mất kết nối · Nháp được giữ để thử lại.</div>');document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('phase').textContent=stage==='finished'?'Ván đã kết thúc · Chỉ đọc':stage==='lobby'?'Sảnh chờ · 5 / 6 ghế':'● Ngày 1 · Đã kết nối';bind();if($('timeline'))$('timeline').scrollTop=scrollPositions[`${actor}/${sub}`]??$('timeline').scrollHeight}
function bind(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>go(...b.dataset.route.split('/')));document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>playerDrawer(b.dataset.person));$('channels-toggle')?.addEventListener('click',()=>{openDialog(tab==='chat'?'Kênh chat':'Tác vụ',sideMarkup(),'',true);$('dialog-body').querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{$('dialog').close();go(...b.dataset.route.split('/'))})});$('members-toggle')?.addEventListener('click',()=>{openDialog('Người chơi',memberMarkup(),'',true);$('dialog-body').querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{$('dialog').close();playerDrawer(b.dataset.person)})});$('emoji')?.addEventListener('click',emojiPicker);$('composer')?.addEventListener('submit',e=>{e.preventDefault();sendMock()});$('compose-text')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMock()}});$('new-messages')?.addEventListener('click',()=>{$('timeline').scrollTop=$('timeline').scrollHeight;$('new-messages').classList.add('hide')});document.querySelectorAll('[data-react],.reaction').forEach(b=>b.onclick=()=>{if(stage==='finished')return;b.textContent='👍 3';b.classList.add('reaction')});document.querySelectorAll('[data-edit-message]').forEach(b=>b.onclick=()=>editMessage(b));document.querySelectorAll('[data-delete-message]').forEach(b=>b.onclick=()=>{b.closest('.message').querySelector('p').textContent='Tin nhắn đã xóa (bản gốc còn trong nhật ký).'});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>roleDetail(+b.dataset.role));document.querySelectorAll('[data-edit-role]').forEach(b=>b.onclick=()=>roleEditor(+b.dataset.editRole));$('create-role')?.addEventListener('click',()=>roleEditor(0));const filter=()=>document.querySelectorAll('[data-role-row]').forEach(el=>el.classList.toggle('hide',!el.dataset.name.includes(($('role-search')?.value||'').toLowerCase())||!!$('faction-filter')?.value&&el.dataset.faction!==$('faction-filter').value));$('role-search')?.addEventListener('input',filter);$('faction-filter')?.addEventListener('change',filter);$('player-search')?.addEventListener('input',()=>document.querySelectorAll('[data-player-row]').forEach(el=>el.classList.toggle('hide',!el.dataset.name.includes($('player-search').value.toLowerCase()))));document.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>{selectedRole=roles[+b.dataset.choose].name;stage='assigned';$('stage').value=stage;render()});$('random-choice')?.addEventListener('click',()=>{selectedRole=roles[1].name;stage='assigned';$('stage').value=stage;render()});$('distribute')?.addEventListener('click',()=>{$('status').textContent='Mẫu: phát role thành công. Đổi Vai → Người Làng, Ván → Chọn role để xem lời mời.'});$('my-request')?.addEventListener('click',requestDialog);$('request-button')?.addEventListener('click',requestDialog);$('review-request')?.addEventListener('click',reviewRequest);$('chat-settings')?.addEventListener('click',chatSettings);$('room-settings')?.addEventListener('click',roomSettings);$('begin-game')?.addEventListener('click',()=>go('role','distribution'));$('open-vote')?.addEventListener('click',openVote);$('close-vote')?.addEventListener('click',()=>{voteClosed=true;render()});$('ballot-form')?.addEventListener('submit',e=>{e.preventDefault();const choice=$('ballot-choice').value;ballot=choice==='skip'?'An bỏ qua':`An vote ${choice}`;render()});$('withdraw')?.addEventListener('click',()=>{ballot='An rút phiếu';render()});$('decide-vote')?.addEventListener('click',()=>confirmDialog('Chốt kết quả vote','Quản trò nhập kết quả. Việc chốt không tự giết hoặc chuyển pha.'));$('advance')?.addEventListener('click',()=>voteClosed?confirmDialog('Chuyển sang Đêm 2','Các tin hẹn sẽ được đăng khi xác nhận chuyển pha.'):openDialog('Vòng vote còn mở','<p>Đóng vòng vote trước khi chuyển pha.</p>','<button id="go-vote" class="primary">Mở kênh Vote</button>'));$('go-vote')?.addEventListener('click',()=>{$('dialog').close();go('chat','vote')});$('pause-game')?.addEventListener('click',()=>confirmDialog('Tạm dừng ván','Cần ghi lý do tạm dừng.',true));$('finish-game')?.addEventListener('click',()=>confirmDialog('Kết thúc ván','Công bố dữ liệu kín theo consent, hủy lịch chờ và khóa ghi.',true));$('next-game')?.addEventListener('click',()=>confirmDialog('Mở ván mới','Giữ lịch sử ván cũ và dùng lại bộ role.'));$('leave')?.addEventListener('click',()=>confirmDialog('Rời phòng','Mẫu xác nhận; không đổi thành viên thật.'));$('edit-schedule')?.addEventListener('click',()=>openDialog('Sửa tin hẹn','<label>Nội dung<textarea>Đêm mới đã bắt đầu.</textarea></label>','<button data-close>Hủy</button><button id="save-mock" class="primary">Lưu</button>'));$('cancel-schedule')?.addEventListener('click',()=>{$('status').textContent='Mẫu: đã hủy lịch, không đăng nội dung ra kênh.'});$('export')?.addEventListener('click',()=>{$('status').textContent='Prototype không xuất dữ liệu thật.'})}
function sendMock(){const input=$('compose-text'),text=input?.value.trim();if(!text)return;let data=messages[`${actor}/${sub}`]||[...(sample[sub.startsWith('dm')?'dm':sub]||sample.general)];if($('timing')?.value==='next'){drafts[`${actor}/${stage}/${sub}`]='';input.value='';openDialog('Đã hẹn tin mẫu','<p>Chỉ quản trò thấy lịch chờ. Tin chưa xuất hiện công khai.</p>');return}data=[...data,[who(),actor==='host'?'Quản trò':'An',text,'Vừa xong']];messages[`${actor}/${sub}`]=data;drafts[`${actor}/${stage}/${sub}`]='';delete scrollPositions[`${actor}/${sub}`];render()}
function emojiPicker(){openDialog('Chọn emoji','<input id="emoji-search" aria-label="Tìm emoji" placeholder="Tìm emoji…"><div class="emoji-grid" style="margin-top:12px">'+['🙂','👍','🐺','🌙','✨','😂','❤️','🤔','🎉','👀','🙏','🕯️'].map(e=>`<button data-emoji="${e}">${e}</button>`).join('')+'</div>');document.querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>{const input=$('compose-text');input.value+=b.dataset.emoji;$('dialog').close();input.focus()})}
function roleDetail(i){const r=roles[i];openDialog(r.name,`${icon(r)} <span class="faction ${r.cls}">${r.faction}</span><h3>Tiên tri soi ra: ${r.seer}</h3><p>${r.desc}</p><h3>Quyền dùng</h3><p>${r.kind} · Điều kiện chi tiết nằm trong mô tả.</p>`)}
function roleEditor(i){const r=roles[i];openDialog('Chỉnh role',`<label>Tên role<input id="role-name" value="${r.name}"></label><label>Phe<select><option>${r.faction}</option><option>Làng</option><option>Sói</option><option>Trung lập</option></select></label><label>Tiên tri soi ra<input value="${r.seer}"></label><label>Loại role<select id="role-kind"><option>Chủ động</option><option>Bị động</option></select></label><label>Mô tả đầy đủ điều kiện và cách dùng<textarea class="description-field">${r.desc}</textarea></label><label>Icon role<input type="file" accept="image/png,image/jpeg,image/webp"><small>PNG/WebP/JPEG tĩnh · tối đa 1 MiB · 512 × 512px</small></label>`,'<button data-close>Hủy</button><button class="primary" id="save-role">Lưu role</button>');$('save-role').onclick=()=>{roles[i].name=$('role-name').value||r.name;$('dialog').close();render()}}
function playerDrawer(id){if(id==='host'){openDialog('Minh · Quản trò','<p>Quản trò điều hành ván và xác nhận kết quả.</p>','',true);return}const p=people.find(x=>x.id===id);openDialog(p.name,`<div class="person"><span class="avatar">${p.initial}</span><div>Ghế ${people.indexOf(p)+1}<small>${p.alive?'Đang sống công khai':'Đã công bố chết'}</small></div></div>${actor==='host'&&stage!=='finished'?`<h3>Role thật</h3><p>${roles[people.indexOf(p)%4].name}</p><h3>Thao tác</h3><div class="toolbar"><button id="kill" class="primary">Giết kín…</button><button id="publish-state">Công bố trạng thái…</button><button id="dm-player">Nhắn riêng</button></div><label>Hiệu ứng<input placeholder="Tên hiệu ứng tự do"></label><button id="effect">Thêm hiệu ứng</button><label>Ghi chú<textarea placeholder="Ghi chú cho ván, không cần lý do riêng"></textarea></label><button id="save-note">Lưu ghi chú</button>`:stage==='finished'?'<p>Role sau trận: '+roles[people.indexOf(p)%4].name+'</p>':'<p>Role chưa được công bố.</p>'}`,'',true);$('kill')?.addEventListener('click',()=>{$('dialog').close();confirmDialog(`Giết kín ${p.name}`,'Chỉ cập nhật trạng thái thật; người khác chưa thấy chết. Không tạo thông báo.')});$('publish-state')?.addEventListener('click',()=>{$('dialog').close();confirmDialog(`Công bố trạng thái ${p.name}`,'Danh sách công khai sẽ đổi. Nội dung thông báo bên dưới là tùy chọn.',false,true)});$('dm-player')?.addEventListener('click',()=>{$('dialog').close();go('chat','dm-'+id)});$('effect')?.addEventListener('click',()=>{$('effect').textContent='Đã thêm (mẫu)'});$('save-note')?.addEventListener('click',()=>{$('save-note').textContent='Đã lưu (mẫu)'})}
function requestDialog(){openDialog('Gửi yêu cầu dùng role','<p class="muted">Đây là yêu cầu có trạng thái, không phải tin chat thường.</p><label>Nội dung<textarea placeholder="Nhập người, con số hoặc nội dung bạn muốn xác nhận…"></textarea></label>','<button data-close>Hủy</button><button class="primary" id="submit-request">Gửi yêu cầu</button>');$('submit-request').onclick=()=>{$('dialog').close();go('chat',actor==='host'?'dm-an':'dm')}}
function reviewRequest(){openDialog('Yêu cầu của An','<p>Tôi muốn xác nhận dùng kỹ năng trong đêm này.</p><h3>Thao tác liên kết</h3><button id="request-effect">Thêm hiệu ứng cho An</button><label style="margin-top:14px">Phản hồi<textarea>Đã xác nhận lựa chọn của bạn.</textarea></label><label>Trạng thái<select><option>Chấp nhận</option><option>Từ chối</option><option>Đang xét</option></select></label><p class="muted">Chấp nhận không tự chạy kỹ năng. Tác động là thao tác riêng.</p>','<button data-close>Hủy</button><button class="primary" id="save-review">Lưu phản hồi</button>',true);$('request-effect').onclick=()=>{$('request-effect').textContent='Mẫu: đã thêm hiệu ứng và liên kết'};$('save-review').onclick=()=>{requestAccepted=true;$('dialog').close();render()}}
function chatSettings(){openDialog('Cài đặt chat','<label class="inline"><input type="checkbox"> Cho chat chung ban đêm</label><label class="inline"><input type="checkbox"> Cho chat đội ban ngày</label><label class="inline"><input type="checkbox"> Người chết được gửi chat chung</label><label>Slow mode<select><option>Tắt</option>'+Array.from({length:9},(_,i)=>`<option>${i+2} giây</option>`).join('')+'</select></label>','<button data-close>Hủy</button><button class="primary" id="save-settings">Lưu</button>');$('save-settings').onclick=()=>$('dialog').close()}
function roomSettings(){openDialog('Thông tin phòng','<label>Tên phòng<input value="Làng Sương Mù"></label><label>Số ghế<input type="number" min="2" max="30" value="6"></label><label class="inline"><input type="checkbox" checked> Mở đăng ký</label>','<button data-close>Hủy</button><button class="primary" id="save-room">Lưu</button>');$('save-room').onclick=()=>$('dialog').close()}
function openVote(){openDialog('Mở vòng vote mới','<label>Chế độ phiếu<select id="vote-mode"><option value="secret">Bí mật</option><option value="public">Công khai ngay khi chốt</option></select></label><label>Đếm ngược<select><option>Không giới hạn thời gian</option><option>180 giây</option></select></label><p class="muted">Chế độ giữ cố định trong vòng này. Vòng public phát cả đổi/rút phiếu.</p>','<button data-close>Hủy</button><button id="confirm-open-vote" class="primary">Mở vòng</button>');$('confirm-open-vote').onclick=()=>{voteMode=$('vote-mode').value;voteClosed=false;ballot=null;$('dialog').close();render()}}
function confirmDialog(title,text,reason=false,optionalText=false){openDialog(title,`<p>${esc(text)}</p>${reason?'<label style="margin-top:16px">Lý do<textarea required></textarea></label>':''}${optionalText?'<label style="margin-top:16px">Nội dung thông báo (không bắt buộc)<textarea placeholder="Để trống nếu không đăng tin"></textarea></label>':''}`,'<button data-close>Hủy</button><button id="confirm-action" class="primary">Xác nhận</button>');$('confirm-action').onclick=()=>{if(reason&&!$('dialog-body').querySelector('textarea').value.trim()){$('dialog-body').querySelector('textarea').focus();return}$('dialog').close();if($('status'))$('status').textContent='Mẫu: đã xác nhận thao tác. Không ghi dữ liệu thật.'}}
$('room-menu').onclick=()=>{openDialog('Làng Sương Mù','<div class="menu-stack"><button id="home-link">← Về trang vào làng</button><button id="copy-code">Mã mời: SUONG</button><button id="history-link">Lịch sử ván</button></div>');$('home-link').onclick=()=>{$('dialog-body').innerHTML='<p>Trang vào làng nằm ngoài shell ba tab. Prototype này chỉ mô phỏng trong phòng.</p>'};$('copy-code').onclick=()=>{$('copy-code').textContent='Mã mẫu: SUONG'};$('history-link').onclick=()=>{$('dialog').close();stage='finished';$('stage').value=stage;go('management','history')}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab,({chat:'general',role:actor==='host'?'catalog':'mine',management:actor==='host'?'players':'room'}[b.dataset.tab])));
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab,b.dataset.tab==='chat'?'general':b.dataset.tab==='role'?(actor==='host'?'catalog':'mine'):(actor==='host'&&stage==='playing'?'players':'room')));
$('actor').onchange=()=>{saveDraft();actor=$('actor').value;render()};
$('stage').onchange=()=>{saveDraft();stage=$('stage').value;sub=tab==='chat'?'general':tab==='role'?(actor==='host'?'catalog':'mine'):'room';render()};
window.addEventListener('hashchange',()=>{saveDraft();readRoute()});
function go(nextTab,nextSub){saveDraft();const route='#'+nextTab+'/'+nextSub;if(location.hash===route){tab=nextTab;sub=nextSub;render()}else location.hash=route}
function readRoute(){const parts=location.hash.slice(1).split('/');tab=['chat','role','management'].includes(parts[0])?parts[0]:'chat';sub=parts[1]||(tab==='chat'?'general':tab==='role'?'catalog':'room');render()}
function editMessage(button){const p=button.closest('.message').querySelector('p');openDialog('Chỉnh tin nhắn','<label>Nội dung<textarea id="edit-text">'+esc(p.textContent)+'</textarea></label>','<button data-close>Hủy</button><button id="save-edit" class="primary">Lưu</button>');$('save-edit').onclick=()=>{p.textContent=$('edit-text').value;$('dialog').close()}}
const params=new URLSearchParams(location.search);demoState=params.get('state')||'normal';if(['host','player','wolf'].includes(params.get('actor')))actor=params.get('actor');if(['lobby','draft','assigned','playing','finished'].includes(params.get('stage')))stage=params.get('stage');$('actor').value=actor;$('stage').value=stage;
readRoute();
</script>
</body></html>
